
name: Deploy Signify Python

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: signify-python-production
  cancel-in-progress: false

jobs:
  ci:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install inference dependencies
        run: python -m pip install -r requirements.txt

      - name: Check imports and API contract
        run: |
          python -c "import api, preprocessing, realtime_translator; assert callable(api.create_app)"
          python -m unittest test_api.py

  build-push-deploy:
    needs: ci
    runs-on: ubuntu-latest

    env:
      IMAGE_REPOSITORY: ${{ vars.DOCKERHUB_IMAGE_REPOSITORY }}
      DOKPLOY_URL: ${{ secrets.DOKPLOY_URL }}
      DOKPLOY_APPLICATION_ID: ${{ secrets.DOKPLOY_APPLICATION_ID }}

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Validate configuration
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
          DOKPLOY_API_KEY: ${{ secrets.DOKPLOY_API_KEY }}
        shell: bash
        run: |
          set -euo pipefail

          for name in \
            DOCKERHUB_USERNAME \
            DOCKERHUB_TOKEN \
            DOKPLOY_URL \
            DOKPLOY_API_KEY \
            DOKPLOY_APPLICATION_ID \
            IMAGE_REPOSITORY
          do
            if [ -z "${!name}" ]; then
              echo "::error::Missing $name"
              exit 1
            fi
          done

          case "$IMAGE_REPOSITORY" in
            */*) ;;
            *)
              echo "::error::Image repository must be namespace/repository"
              exit 1
              ;;
          esac

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: |
            ${{ env.IMAGE_REPOSITORY }}:${{ github.sha }}
            ${{ env.IMAGE_REPOSITORY }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Deploy Python Application to Dokploy
        env:
          DOKPLOY_API_KEY: ${{ secrets.DOKPLOY_API_KEY }}
        shell: bash
        run: |
          set -euo pipefail

          payload=$(jq -cn \
            --arg id "$DOKPLOY_APPLICATION_ID" \
            '{applicationId:$id}')

          response_file=$(mktemp)
          trap 'rm -f "$response_file"' EXIT

          status=$(curl \
            --silent \
            --show-error \
            --retry 3 \
            --output "$response_file" \
            --write-out '%{http_code}' \
            --request POST \
            "${DOKPLOY_URL%/}/api/application.deploy" \
            --header 'accept: application/json' \
            --header 'Content-Type: application/json' \
            --header "x-api-key: $DOKPLOY_API_KEY" \
            --data "$payload")

          if [[ ! "$status" =~ ^2[0-9][0-9]$ ]]; then
            echo "::error::Dokploy deployment failed (HTTP $status)"
            exit 1
          fi

          if [ -s "$response_file" ] && \
            jq -e 'type == "object" and has("error")' \
              "$response_file" >/dev/null 2>&1; then
            echo "::error::Dokploy returned an error response"
            exit 1
          fi

          echo "Dokploy accepted deployment request (HTTP $status)"
