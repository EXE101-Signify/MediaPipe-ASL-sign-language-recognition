name: Deploy Signify Python

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: signify-python-${{ github.ref }}
  cancel-in-progress: false

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Install inference dependencies
        run: python -m pip install -r requirements.txt
      - name: Check syntax, imports and API tests
        run: |
          python -m compileall -q api.py preprocessing.py realtime_translator.py motion.py smoothing.py ui.py test_api.py
          python -c "import api, preprocessing, realtime_translator; assert callable(api.create_app)"
          python -m unittest test_api.py

  deploy:
    needs: ci
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    env:
      DOKPLOY_URL: ${{ secrets.DOKPLOY_URL }}
      DOKPLOY_API_KEY: ${{ secrets.DOKPLOY_API_KEY }}
      DOKPLOY_APPLICATION_ID: ${{ secrets.DOKPLOY_APPLICATION_ID }}
    steps:
      - name: Trigger Dokploy Application deployment
        shell: bash
        run: |
          set -euo pipefail
          for name in DOKPLOY_URL DOKPLOY_API_KEY DOKPLOY_APPLICATION_ID; do
            if [ -z "${!name}" ]; then
              echo "::error::Missing $name"
              exit 1
            fi
          done
          case "$DOKPLOY_URL" in
            https://*) ;;
            *) echo '::error::DOKPLOY_URL must use HTTPS' >&2; exit 1 ;;
          esac
          payload=$(jq -cn --arg id "$DOKPLOY_APPLICATION_ID" '{applicationId:$id}')
          response_file=$(mktemp)
          trap 'rm -f "$response_file"' EXIT
          status=$(curl --silent --show-error --retry 2 --retry-connrefused \
            --output "$response_file" --write-out '%{http_code}' \
            --request POST "${DOKPLOY_URL%/}/api/application.deploy" \
            --header 'accept: application/json' \
            --header 'Content-Type: application/json' \
            --header "x-api-key: $DOKPLOY_API_KEY" \
            --data "$payload")
          if [[ ! "$status" =~ ^2[0-9][0-9]$ ]]; then
            echo "::error::Dokploy rejected deployment (HTTP $status)" >&2
            exit 1
          fi
          if [ -s "$response_file" ] && ! jq empty "$response_file" >/dev/null 2>&1; then
            echo '::error::Dokploy returned an invalid JSON response' >&2
            exit 1
          fi
          if [ -s "$response_file" ] && jq -e 'type == "object" and (has("error") or (.code? == "BAD_REQUEST") or (.code? == "UNAUTHORIZED") or (.code? == "FORBIDDEN") or (.code? == "NOT_FOUND") or (.code? == "INTERNAL_SERVER_ERROR"))' "$response_file" >/dev/null 2>&1; then
            echo '::error::Dokploy returned an error response' >&2
            exit 1
          fi
          echo "Dokploy accepted deployment request (HTTP $status); check its deployment status in Dokploy"
