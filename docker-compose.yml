services:
  signify-python:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    expose:
      - "8000"
    volumes:
      - type: bind
        source: ./asl_cnn_model.onnx
        target: /app/asl_cnn_model.onnx
        read_only: true
        bind:
          create_host_path: false
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=4).close()"]
      interval: 30s
      timeout: 5s
      start_period: 45s
      retries: 3
